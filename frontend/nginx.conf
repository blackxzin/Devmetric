server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API no mesmo dominio do frontend: sem CORS e sem URL da API embutida no JS.
    # API_UPSTREAM vem do ambiente (docker compose: http://api:8080).
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Link curto para o perfil publico: /u/fulano
    location ~ ^/u/([a-zA-Z0-9-]+)/?$ {
        return 302 /profile.html?u=$1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabecalhos basicos de seguranca para uma SPA estatica.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(css|js|svg|png|jpg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
