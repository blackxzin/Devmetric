services:
  db:
    image: postgres:16-alpine
    container_name: devmetrics-db
    environment:
      POSTGRES_DB: ${DB_NAME:-devmetrics}
      POSTGRES_USER: ${DB_USER:-devmetrics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devmetrics}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - devmetrics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devmetrics} -d ${DB_NAME:-devmetrics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: devmetrics-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-devmetrics}
      DB_USER: ${DB_USER:-devmetrics}
      DB_PASSWORD: ${DB_PASSWORD:-devmetrics}
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-producao-com-no-minimo-32-bytes}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-devmetrics-chave-aes-local-32ch!}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/api/v1/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./frontend
    container_name: devmetrics-web
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "3000:80"

volumes:
  devmetrics-db-data:
